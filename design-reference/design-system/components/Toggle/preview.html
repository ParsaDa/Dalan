<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;family=Vazirmatn:wght@400..800&amp;display=swap"><style>body{margin:0;background:transparent}.dl{overflow:visible}.pv{padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}</style></head>
<body><div class="dl t-dark fx-full ac-saffron" style="background:var(--bg);min-height:110px"><div class="bgfx" aria-hidden="true"><div class="glow g1"></div></div><div class="pv"><div class="row" style="gap:18px"><button class="tg" role="switch" aria-checked="true" aria-label="On"></button><button class="tg" role="switch" aria-checked="false" aria-label="Off"></button><button class="tg busy" role="switch" aria-checked="true" aria-label="Starting"></button><span class="mut" style="font-weight:650">on · off · busy</span></div><div class="row ac-rose t-dark" style="gap:18px"><button class="tg" role="switch" aria-checked="true" aria-label="Rose on"></button><span class="mut" style="font-weight:650">follows the node accent</span></div></div></div><script>(function(){var t=document.documentElement.getAttribute('data-theme')||'dark';document.querySelectorAll('.dl').forEach(function(e){e.classList.remove('t-dark','t-light');e.classList.add('t-'+(t==='light'?'light':'dark'));});})();</script></body></html>
