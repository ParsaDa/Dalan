<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;family=Vazirmatn:wght@400..800&amp;display=swap"><style>
body{margin:0}
.cv{position:relative;width:960px;height:300px;background:var(--bg);overflow:hidden;font-family:Manrope,system-ui,sans-serif}
.brand{fill:var(--brand)}.ink{fill:var(--text)}.mint{fill:var(--mint)}.rose{fill:var(--accent-rose)}.cob{fill:var(--accent-cobalt)}.surf{fill:var(--surface)}
.arch{fill:none;stroke:var(--text);stroke-width:6;stroke-linecap:round}.arch2{fill:none;stroke:var(--bg);stroke-width:6;stroke-linecap:round}
.nm{position:absolute;left:40px;bottom:40px;width:440px;color:var(--text)}
.nm h1{margin:0;font-size:120px;line-height:.92;font-weight:800;letter-spacing:-.04em}
.nm p{margin:12px 0 0;font-size:14px;color:var(--text-muted);font-weight:600}
</style></head><body><div class="cv">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!-- blocks: brand 220x300 (radius-pill top = arch), surface 160x300, mint 80x120, rose 80x80, cobalt 80x60 · arrangement: one tall slab with satellites, bleeding off top and bottom
     pattern: literal motif (Dalan = corridor) → nested arches built from radius-pill half-rounds, receding into the saffron slab
     steps: space-5 18 / space-9 36 gaps, radius-lg 18 on satellites -->
<rect class="surf" x="520" y="0" width="160" height="300"></rect>
<path class="brand" d="M700 300V130a110 110 0 0 1 220 0v170z"></path>
<path class="arch2" d="M738 300V146a72 72 0 0 1 144 0v154"></path>
<path class="arch2" d="M774 300V162a36 36 0 0 1 72 0v138" opacity=".7"></path>
<path class="arch" d="M548 300V200a52 52 0 0 1 104 0v100"></path>
<path class="arch" d="M576 300V214a24 24 0 0 1 48 0v86" opacity=".55"></path>
<rect class="mint" x="520" y="36" width="80" height="120" rx="18"></rect>
<rect class="rose" x="600" y="36" width="80" height="80" rx="18"></rect>
<rect class="cob" x="880" y="0" width="80" height="60" rx="18"></rect>
</svg>
<div class="nm"><h1>Dalan</h1><p>A corridor through the wall: calm, glass and saffron light.</p></div>
</div></body></html>
