<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;family=Vazirmatn:wght@400..800&amp;display=swap"><style>body{margin:0;background:transparent}.dl{overflow:visible}.pv{padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}</style></head>
<body><div class="dl t-dark fx-full ac-saffron" style="background:var(--bg);min-height:420px"><div class="bgfx" aria-hidden="true"><div class="glow g1"></div></div><div class="pv"><div style="position:relative;width:640px;height:380px;border-radius:18px;overflow:hidden"><div class="scrim" style="position:absolute;animation:none"><form class="modal" role="dialog" aria-label="Add client" style="animation:none"><div class="row sp"><h2 class="h2">Add client</h2><button type="button" class="ib sm" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg></button></div>
<div class="grid" style="gap:14px"><label class="field s12"><span>Name</span><input class="inp" placeholder="For example sara.k" /></label><label class="field s6"><span>Traffic limit</span><select class="inp"><option>50 GB</option></select></label><label class="field s6"><span>Expires</span><select class="inp"><option>In 30 days</option></select></label></div>
<div class="mfoot"><button type="button" class="btn ghost">Cancel</button><button type="submit" class="btn pri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Create and copy link</button></div></form></div></div></div></div><script>(function(){var t=document.documentElement.getAttribute('data-theme')||'dark';document.querySelectorAll('.dl').forEach(function(e){e.classList.remove('t-dark','t-light');e.classList.add('t-'+(t==='light'?'light':'dark'));});})();</script></body></html>
